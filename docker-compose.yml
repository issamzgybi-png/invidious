services:
  invidious:
    image: quay.io/invidious/invidious:latest
    restart: unless-stopped

    expose:
      - "3000"

    environment:
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: kemal
          password: ${SERVICE_PASSWORD_POSTGRES}
          host: invidious-db
          port: 5432

        check_tables: true

        domain: app.fullcontrolvpn.com
        external_port: 443
        https_only: true

        statistics_enabled: false
        disable_proxy: false
        pool_size: 150

        hmac_key: "${SERVICE_HEX_64_HMAC}"

        invidious_companion:
          - private_url: "http://companion:8282/companion"
            public_url: "https://companion.fullcontrolvpn.com/companion"

        invidious_companion_key: "${COMPANION_SECRET}"

        use_pubsub_feeds: true
        use_innertube_for_captions: true

        default_user_preferences:
          preload: true
          quality: dash
          quality_dash: 1080p
          local: true
          autoplay: false
          listen: false

    depends_on:
      invidious-db:
        condition: service_healthy
      companion:
        condition: service_started

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/v1/stats || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

    logging:
      options:
        max-size: "256M"
        max-file: "4"

  companion:
    image: quay.io/invidious/invidious-companion:latest
    restart: unless-stopped

    expose:
      - "8282"

    environment:
      HOST: "0.0.0.0"
      PORT: "8282"

      SERVER_SECRET_KEY: "${COMPANION_SECRET}"
      SERVER_BASE_PATH: "/companion"
      SERVER_ENABLE_METRICS: "true"

      CACHE_ENABLED: "true"
      CACHE_DIRECTORY: "/var/tmp"

      JOBS_YOUTUBE_SESSION_PO_TOKEN_ENABLED: "true"
      JOBS_YOUTUBE_SESSION_FREQUENCY: "*/5 * * * *"

      NETWORKING_VIDEOPLAYBACK_VIDEO_FETCH_CHUNK_SIZE_MB: "1"
      NETWORKING_FETCH_TIMEOUT_MS: "30000"

    cap_drop:
      - ALL

    read_only: true

    security_opt:
      - no-new-privileges:true

    volumes:
      - companioncache:/var/tmp:rw

    logging:
      options:
        max-size: "256M"
        max-file: "4"

  invidious-db:
    image: docker.io/library/postgres:14
    restart: unless-stopped

    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: kemal
      POSTGRES_PASSWORD: "${SERVICE_PASSWORD_POSTGRES}"

    volumes:
      - postgresdata:/var/lib/postgresql/data
      - ./config/sql:/config/sql
      - ./docker/init-invidious-db.sh:/docker-entrypoint-initdb.d/init-invidious-db.sh

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

    logging:
      options:
        max-size: "256M"
        max-file: "4"

volumes:
  postgresdata:
  companioncache:
