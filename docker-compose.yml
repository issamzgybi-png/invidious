services:
  invidious:
    image: quay.io/invidious/invidious:latest
    restart: unless-stopped

    environment:
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: kemal
          password: ${SERVICE_PASSWORD_POSTGRES}
          host: invidious-db
          port: 5432

        check_tables: true

        domain: ${SERVICE_FQDN_INVIDIOUS_3000}
        external_port: 443
        https_only: true

        statistics_enabled: false

        hmac_key: "${SERVICE_HEX_64_HMAC}"

        invidious_companion:
          - private_url: "http://companion:8282/companion"

        invidious_companion_key: "${SERVICE_HEX_64_COMPANION}"

        use_pubsub_feeds: true
        use_innertube_for_captions: true

    depends_on:
      - invidious-db
      - companion

    healthcheck:
      test: wget -nv --tries=1 --spider http://127.0.0.1:3000/api/v1/stats || exit 1
      interval: 30s
      timeout: 5s
      retries: 3

    logging:
      options:
        max-size: "1G"
        max-file: "4"

  companion:
    image: quay.io/invidious/invidious-companion:latest
    restart: unless-stopped

    environment:
      SERVER_SECRET_KEY: ${SERVICE_HEX_64_COMPANION}

    cap_drop:
      - ALL

    read_only: true

    security_opt:
      - no-new-privileges:true

    volumes:
      - companioncache:/var/tmp/youtubei.js:rw

    logging:
      options:
        max-size: "1G"
        max-file: "4"

  invidious-db:
    image: docker.io/library/postgres:14
    restart: unless-stopped

    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: kemal
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}

    volumes:
      - postgresdata:/var/lib/postgresql/data
      - ./config/sql:/config/sql
      - ./docker/init-invidious-db.sh:/docker-entrypoint-initdb.d/init-invidious-db.sh

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  postgresdata:
  companioncache:
