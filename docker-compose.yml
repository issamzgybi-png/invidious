services:
  invidious:
    image: quay.io/invidious/invidious:2.20260626.0
    restart: unless-stopped
        ports:
      - "192.168.2.137:3000:3000"
    expose:
      - "3000"
    environment:
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: kemal
          password: ${SERVICE_PASSWORD_POSTGRES}
          host: invidious-db
          port: 5432

        check_tables: true

        domain: app.fullcontrolvpn.com
        external_port: 443
        https_only: true
        hsts: true

        statistics_enabled: false
        hmac_key: "${SERVICE_HEX_64_HMAC}"

        invidious_companion:
          - private_url: "http://companion:8282/companion"
            public_url: "https://app.fullcontrolvpn.com/companion"

        invidious_companion_key: "${SERVICE_PASSWORD_COMPANION}"

        use_pubsub_feeds: true
        use_innertube_for_captions: true

        default_user_preferences:
          quality: dash
          quality_dash: best
          local: true
          preload: true
    depends_on:
      invidious-db:
        condition: service_healthy
      companion:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging:
      options:
        max-size: "1G"
        max-file: "4"

  companion:
    image: quay.io/invidious/invidious-companion:latest
    restart: unless-stopped
    expose:
      - "8282"
    environment:
      HOST: "0.0.0.0"
      PORT: "8282"
      SERVER_BASE_PATH: "/companion"
      SERVER_SECRET_KEY: "${SERVICE_PASSWORD_COMPANION}"

      CACHE_ENABLED: "true"
      CACHE_DIRECTORY: "/var/tmp"

      NETWORKING_FETCH_TIMEOUT_MS: "30000"
      NETWORKING_VIDEOPLAYBACK_VIDEO_FETCH_CHUNK_SIZE_MB: "10"

      JOBS_YOUTUBE_SESSION_PO_TOKEN_ENABLED: "true"
      JOBS_YOUTUBE_SESSION_FREQUENCY: "*/5 * * * *"
    healthcheck:
      test: ["CMD", "/thc"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - companioncache:/var/tmp/youtubei.js:rw
    logging:
      options:
        max-size: "1G"
        max-file: "4"

  invidious-db:
    image: docker.io/library/postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: kemal
      POSTGRES_PASSWORD: "${SERVICE_PASSWORD_POSTGRES}"
    volumes:
      - postgresdata:/var/lib/postgresql/data
      - ./config/sql:/config/sql
      - ./docker/init-invidious-db.sh:/docker-entrypoint-initdb.d/init-invidious-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  postgresdata:
  companioncache:
