services:
  invidious:
    image: quay.io/invidious/invidious:2.20260626.0
    restart: unless-stopped

    expose:
      - "3000"

    labels:
      - traefik.enable=true

      # Main Invidious route: everything EXCEPT /companion
      - traefik.http.routers.invidious.rule=Host(`app.fullcontrolvpn.com`) && !PathPrefix(`/companion`)
      - traefik.http.routers.invidious.priority=10
      - traefik.http.services.invidious.loadbalancer.server.port=3000

    environment:
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: kemal
          password: ${SERVICE_PASSWORD_POSTGRES}
          host: invidious-db
          port: 5432

        check_tables: true

        domain: app.fullcontrolvpn.com
        external_port: 443
        https_only: true

        statistics_enabled: false

        hmac_key: "${SERVICE_HEX_64_HMAC}"

        invidious_companion:
          - private_url: "http://companion:8282/companion"
            public_url: "https://app.fullcontrolvpn.com/companion"

        invidious_companion_key: "${SERVICE_PASSWORD_COMPANION}"

        use_pubsub_feeds: true
        use_innertube_for_captions: true

    depends_on:
      invidious-db:
        condition: service_healthy
      companion:
        condition: service_started

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/v1/stats || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

    logging:
      options:
        max-size: "1G"
        max-file: "4"

  companion:
    image: quay.io/invidious/invidious-companion:latest
    restart: unless-stopped

    expose:
      - "8282"

    labels:
      - traefik.enable=true

      # Companion route: only /companion and below
      - traefik.http.routers.invidious-companion.rule=Host(`app.fullcontrolvpn.com`) && PathPrefix(`/companion`)
      - traefik.http.routers.invidious-companion.priority=100
      - traefik.http.services.invidious-companion.loadbalancer.server.port=8282

    environment:
      SERVER_SECRET_KEY: "${SERVICE_PASSWORD_COMPANION}"

    cap_drop:
      - ALL

    read_only: true

    security_opt:
      - no-new-privileges:true

    volumes:
      - companioncache:/var/tmp/youtubei.js:rw

    logging:
      options:
        max-size: "1G"
        max-file: "4"

  invidious-db:
    image: docker.io/library/postgres:14
    restart: unless-stopped

    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: kemal
      POSTGRES_PASSWORD: "${SERVICE_PASSWORD_POSTGRES}"

    volumes:
      - postgresdata:/var/lib/postgresql/data
      - ./config/sql:/config/sql:ro
      - ./docker/init-invidious-db.sh:/docker-entrypoint-initdb.d/init-invidious-db.sh:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgresdata:
  companioncache:
